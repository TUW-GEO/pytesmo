# This workflow will install Python dependencies and run tests on
# windows and linux systems with a variety of Python versions

# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule: # only upstream, won't trigger on forks!
    - cron: '0 0 * * *' # daily
jobs:

  build:
    strategy:
      matrix:
        # test matrix - tests run against the editable install, independent
        # of wheel building (which now lives in the build_wheels job)
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    env:
      dist_vers: '3.13'   # python version to create sdist from, use the latest availabe
    name: py${{ matrix.python-version }}@${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
           miniconda-version: "latest"
           auto-update-conda: true
           python-version: ${{ matrix.python-version }}
           environment-file: environment.yml
           activate-environment: pytesmo
           channel-priority: flexible
           auto-activate: false
      - name: Print Infos
        run: |
          git status
          conda info -a
          conda list
          pip list
          which pip
          which python
          gcc -v
      - name: Export Environment
        shell: bash -l {0}
        run: |
          mkdir -p artifacts
          filename=env_py${{ matrix.python-version }}_${{ matrix.os }}.yml
          conda env export --no-builds | grep -v "prefix" > artifacts/$filename
      - name: Install package and dependencies
        shell: bash -l {0}
        run: |
          pip install -e .[testing]
      - name: Run unit tests
        shell: bash -l {0}
        run: |
          pytest
      - name: Upload Coverage
        continue-on-error: true
        shell: bash -l {0}
        run: |
          pip install coveralls && coveralls --service=github-actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true
      - name: Build sdist
        # sdist only needs to be built once, on Linux with the chosen python
        if: runner.os == 'Linux' && matrix.python-version == env.dist_vers
        shell: bash -l {0}
        run: |
          pip install build
          python -m build --sdist --outdir artifacts/dist_whl
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Artifacts-${{ matrix.python-version }}-${{ matrix.os }}
          path: artifacts/*

  build_wheels:
    # Build wheels once per OS. cibuildwheel runs under a fixed modern host
    # python (3.12) and builds every target CPython itself.
    name: Build wheels @${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheels
        run: |
          pipx run cibuildwheel --output-dir artifacts/dist_whl
        env:
          # build the same CPython versions as the test matrix
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
      - name: Check wheels
        run: |
          pipx run twine check artifacts/dist_whl/*
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Artifacts-wheels-${{ matrix.os }}
          path: artifacts/*

  wrapup:
    name: Wrap-Up Builds
    needs: [build, build_wheels]
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      # Merge artifacts from multiple builds
      - name: Merge Uploaded Artifacts
        uses: actions/upload-artifact/merge@v6
        with:
          name: Artifacts
          delete-merged: true
      # Send the coverage reports to Coveralls.io
      - name: Finish Coverage
        run: |
          pip3 install --upgrade coveralls && coveralls --service=github-actions --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    # Upload the dist and whl packages from artifacts to pypi
    name: Upload to PyPI
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      startsWith(github.repository, 'TUW-GEO')
    needs: wrapup
    runs-on: ubuntu-latest
    steps:
      - name: Print environment variables
        run: |
          echo "GITHUB_REF = $GITHUB_REF"
          echo "GITHUB_REPOSITORY = $GITHUB_REPOSITORY"
      - name: Download Artifacts
        uses: actions/download-artifact@v6
        with:
          path: Artifacts
          pattern: Artifacts*
          merge-multiple: true
  
      - name: Display downloaded files
        run: ls -aR
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip_existing: true
          verbose: true
          verify_metadata: true
          packages_dir: Artifacts/dist_whl/
          user: __token__
          # token needs to be uploaded to github actions secrets
          password: ${{ secrets.PYPI_API_TOKEN }}